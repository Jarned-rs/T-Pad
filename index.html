<html>
<head>
    <title> T-Dash </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>T-Dash</h1>
        <p>Telemetry Dashboard</p>
        <p id="connection-status">Demo mode — sample data</p>
    </header>

<main class="dashboard">
    <section class="card">
        <h2>Temperature</h2>
        <p id="temperature">— °C</p>
    </section>

    <section class="card">
        <h2>Humidity</h2>
        <p id="humidity">— %</p>
    </section>

    <section class="card">
        <h2>Light</h2>
        <p id="light">— lux</p>
    </section>

    <section class="card">
        <h2>Voltage</h2>
        <p id="voltage">— V</p>
    </section>

    <section class="card">
        <h2>Current</h2>
        <p id="current">— A</p>
    </section>

    <section class="card">
        <h2>Power</h2>
        <p id="power">— W</p>
    </section>

    <section class="card">
        <h2>Acceleration</h2>
        <p id="acceleration">— m/s²</p>
    </section>

    <section class="card">
        <h2>Gyroscope</h2>
        <p id="gyroscope">—</p>
    </section>
</main>

</body>
</html>
